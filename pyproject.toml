[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opcvm-ratios"
version = "0.1.0"
description = "Outil local d'aide au contrôle des ratios réglementaires OPCVM (UCITS)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "xlsxwriter>=3.1",
  "reportlab>=4.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
opcvm-ratios = "opcvm_ratios.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opcvm_ratios = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
