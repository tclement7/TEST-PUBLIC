id: LU-UCITS-43-1-DEPOTS-20
version: 1
name: "Dépôts auprès d'un même établissement – 20 %"
category: depots_liquidites
framework: UCITS
jurisdiction: LU
definition: "Un OPCVM ne peut investir plus de 20 % de ses actifs dans des dépôts placés auprès d'une même entité."
formula: "Pour chaque établissement e : w(e) = Σ dépôts auprès de e / actif net ; contrôle max w(e) ≤ 20 %."
calculator: weight_by_key
params:
  base: net_assets
  amount_field: total_market_value
  key_field: issuer_id
  filters:
    - {field: instrument_type, op: in, value: [deposit]}
limits:
  - {key: max_weight, label: "Poids maximal auprès d'un établissement", operator: "<=", value: "0.20"}
applicability:
  all:
    - {field: legal_framework, op: eq, value: UCITS}
    - {field: domicile, op: eq, value: LU}
exceptions:
  - "Seuls les dépôts (à terme) sont visés ; les comptes à vue relèvent des liquidités à titre accessoire (règle LU-UCITS-LIQUIDITES-ACCESSOIRES-20) — qualification à confirmer."
required_data: [net_assets, positions.total_market_value, positions.issuer_id]
sources:
  - {source: LU-LOI-2010, article: "art. 43 §1", confidence: a_confirmer}
  - {source: EU-DIR-2009-65, article: "art. 52 §1", confidence: a_confirmer}
valid_from: "2010-12-17"
valid_to: null
validity_note: "Date de la loi ; date d'entrée en vigueur à confirmer"
